name: Build & Deploy

on:
  push:
    branches: [master]

env:
  IMAGE: ghcr.io/axiks/lumi-auth

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # The GHCR namespace this repo publishes to is `axiks` (see IMAGE above), which is
          # NOT necessarily the repo owner — this repo can live in an org while its packages
          # stay in that personal namespace. Pin the login to the namespace owner so a repo
          # transfer can't change it out from under us.
          username: Axiks
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
